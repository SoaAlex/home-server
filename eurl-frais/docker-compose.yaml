services:
  runner:
    build: .
    image: eurl-frais:latest
    entrypoint: ["python", "-m", "eurl_frais"]
    init: true
    shm_size: "1gb"
    env_file:
      - path: .env
        required: false
    environment:
      EURL_LOYER_DIR: /eurl/LOYER
      EURL_CHARGES_DIR: /eurl/CHARGES
      EURL_STATE_DIR: /state
      TZ: Europe/Paris
    user: "1000:10"
    volumes:
      - ./:/app:ro
      # Seuls dossiers EURL accessibles (lecture/écriture) : LOYER et CHARGES.
      # Dossier synchronisé OneDrive : CLOUD_NAS, réorganisé le 2026-10-30 (ancienne arborescence TRAVAIL/EURL/{LOYER,CHARGES}).
      # Chemin hôte du dossier de l'EURL : EURL_CLOUD_DIR dans .env (non versionné, nom de la société).
      - ${EURL_CLOUD_DIR:?EURL_CLOUD_DIR missing in .env}/Loyer:/eurl/LOYER:rw
      - ${EURL_CLOUD_DIR:?EURL_CLOUD_DIR missing in .env}/Charges:/eurl/CHARGES:rw
      - ./state:/state:rw
