# Gitleaks configuration, used by .githooks/pre-commit, .githooks/commit-msg and by
# full scans:
#
#   gitleaks git --redact -v .        # whole history
#   gitleaks dir --redact -v <dir>    # a directory tree
#
# The built-in rules stay on; the rules below add what this stack uses and the
# built-in set lacks.
title = "home-server"

[extend]
useDefault = true

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL (the token is part of the path)"
regex = '''(?i)https?://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/(?:v\d+/)?webhooks/\d{17,20}/[A-Za-z0-9_-]{40,}'''
keywords = ["webhooks"]

[[rules]]
id = "wireguard-key"
description = "WireGuard PrivateKey or PresharedKey"
regex = '''(?i)(?:private|preshared)[_ -]?key["']?\s*[:=]\s*["']?([A-Za-z0-9+/]{43}=)'''
secretGroup = 1
entropy = 3.5
keywords = ["privatekey", "presharedkey", "private_key", "preshared_key", "private key", "preshared key", "private-key", "preshared-key"]

[[rules]]
id = "url-credentials"
description = "Password embedded in a URL (scheme://user:password@host)"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@"'<>]{0,64}:([^\s@/"'<>]{8,})@[a-z0-9][^\s/"'<>]*'''
secretGroup = 1
entropy = 3.0
keywords = ["://"]

[[rules.allowlists]]
description = "placeholders and variable references: the whole password is the placeholder"
regexTarget = "secret"
regexes = [
  '''(?i)^(?:password|passwd|passw0rd|secret|changeme|change-me|changeit|yourpass(?:word)?|your[-_]password|userpass|dbpassword|x{4,}|\*{3,}|\.{3,})$''',
  '''^\$\{?[A-Za-z_]''',
  '''^\{\{''',
  '''^%[A-Za-z_]''',
  '''^<[^>]*>$''',
  '''^\{FRIGATE_[A-Za-z0-9_]+\}$''',
]

[[rules]]
id = "password-hash"
description = "Password hash: bcrypt, Argon2, Balloon, PBKDF2 (any case, Django too), scrypt, yescrypt, SHA-crypt, MD5-crypt, Apache apr1, phpass, htpasswd {SHA}"
regex = '''(?i)(?:\$2[aby]\$\d{2}\$[./a-z0-9]{50,}|\$argon2(?:id|i|d)\$[^\s"']{20,}|\$balloon-[a-z0-9]+\$[^\s"']{20,}|\$pbkdf2(?:-[a-z0-9]+)?\$[^\s"']{20,}|\$scrypt\$[^\s"']{20,}|\$(?:1|5|6|apr1)\$(?:[a-z0-9,=]+\$)?[./a-z0-9]{1,16}\$[./a-z0-9]{20,}|\$y\$[./a-z0-9]+\$[./a-z0-9]{1,24}\$[./a-z0-9]{20,}|\$7\$[./a-z0-9]{10,}\$[./a-z0-9]{20,}|\$[ph]\$[./a-z0-9]{30,}|\bpbkdf2_sha(?:1|256|512)\$\d+\$[a-z0-9+/=]+\$[a-z0-9+/=]{20,}|\{s?sha(?:1|256|512)?\}[a-z0-9+/]{27,}={0,2})'''
keywords = ["$balloon", "$argon2", "$pbkdf2", "pbkdf2_", "$scrypt", "$2a$", "$2b$", "$2y$", "$1$", "$5$", "$6$", "$7$", "$y$", "$apr1$", "$p$", "$h$", "{sha", "{ssha"]
