version: '3.8'

services:
  ## TOOLS
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - /volume1/docker/home-server/nginx-proxy-manager/data:/data
      - /volume1/docker/home-server/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    networks:
      - home-server-network

  ## SERVICES
  pihole:
    image: pihole/pihole
    container_name: Pi-Hole
    networks:
      macvlan_net:
        ipv4_address: 192.168.1.100
        # Pinned so the router's static DHCP lease keeps matching. Docker 29.x
        # randomises macvlan MACs on every network recreate; unpinned, the
        # reservation silently stops matching and .100 can be leased away.
        # Follows Docker's old scheme: 02:42 + IP in hex (0x64 = 100).
        mac_address: 02:42:c0:a8:01:64
    security_opt:
      - no-new-privileges:false
    restart: unless-stopped
    volumes:
      - /volume1/docker/home-server/pihole/dnsmasq.d:/etc/dnsmasq.d:rw
      - /volume1/docker/home-server/pihole/pihole:/etc/pihole:rw
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      FTLCONF_webserver_port: 8080
      FTLCONF_dns_listeningMode: all
      TZ: Europe/Paris
      DNSMASQ_USER: pihole
      PIHOLE_UID: 1000
      PIHOLE_GID: 10
    cap_add:
      - SYS_TIME
      - SYS_NICE

  bitwarden:
    image: vaultwarden/server:latest
    container_name: bitwarden
    ports:
      - '83:80'
      - '3012:3012'
    volumes:
      - /volume1/docker/home-server/vw-data:/data
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped
    networks:
      - home-server-network

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 10
      TZ: Europe/Paris
      PASSWORD: ${CODE_SERVER_PASSWORD}
      DEFAULT_WORKSPACE: /volume1/docker
    volumes:
      - /volume1/docker/home-server/code-server/config:/config
      - /volume1:/volume1
      - /volume2:/volume2
    ports:
      - '8443:8443'
    networks:
      - home-server-network

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    # Host mode, not macvlan: a macvlan child cannot reach its parent's own IP,
    # which made the NAS itself (192.168.1.55) unreachable from the VPN.
    # Host mode also gives kernel-space WireGuard and avoids double NAT.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # No sysctls here: runc rejects namespaced net.* sysctls under network_mode
    # host. src_valid_mark is only needed for wg-quick's default-route trick
    # (client mode, AllowedIPs 0.0.0.0/0). This is a server with /32 peer routes,
    # so it never applies. If it were ever needed, set it on the host instead.
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SERVERURL=vpn.soaalex.com
      - SERVERPORT=51820
      - PEERS=4
      - PEERDNS=192.168.1.100
      - LOG_CONFS=true
    volumes:
      - /volume1/docker/home-server/wireguard/config:/config
    restart: unless-stopped

  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    ports:
      - 1080:3000
    env_file:
      - ./aiostreams/.env
    volumes:
      - /volume1/docker/home-server/aiostreams:/app/data
    networks:
      - home-server-network
      - common-network

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # N100 iGPU: VAAPI decode + OpenVINO detect
    environment:
      TZ: Europe/Paris
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker/home-server/frigate/config:/config
      - /volume2/NAS-STORAGE/frigate:/media/frigate
    tmpfs:
      - /tmp/cache:size=1000000000   # keeps clip churn off the SSD
    ports: ["8971:8971"]
    networks:
      - home-server-network

  # Named PTZ positions for the CAM-PT2. The camera's ONVIF preset store is a
  # no-op and the eWeLink presets live in SONOFF's cloud, so positions are kept
  # as coordinates here and replayed with AbsoluteMove. Exists because ONVIF
  # WS-Security digest needs a per-request nonce, which Home Assistant's
  # rest_command cannot produce on its own.
  ptz-preset:
    image: python:3.12-alpine
    container_name: ptz-preset
    restart: unless-stopped
    command: python /app/ptz_preset.py
    environment:
      PTZ_HOST: 192.168.1.29
      PTZ_USER: ${PTZ_CAMERA_USER}
      PTZ_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      PTZ_TOKEN: ${PTZ_API_TOKEN}
      PTZ_STATE_FILE: /data/presets.json
      TZ: Europe/Paris
    volumes:
      - /volume1/docker/home-server/ptz-preset/ptz_preset.py:/app/ptz_preset.py:ro
      - /volume1/docker/home-server/ptz-preset/data:/data
    ports: ["8095:8095"]
    networks:
      - home-server-network

networks:
  home-server-network:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24
        # ULA (RFC 4193), not the 2001:db8::/32 documentation prefix.
        # Internal container-to-container only; never routed off the host.
        - subnet: "fd7c:9e4a:1b3f:1::/64"

  macvlan_net:
    driver: macvlan
    driver_opts:
      parent: bridge0
    ipam:
      config:
        # No IPv6 here on purpose: the ISP prefix is dynamic, so hardcoding it
        # breaks on every rotation. (The old entry was inert anyway - enable_ipv6
        # was never set on this network, so Docker never applied it.)
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
          # Pin IPAM away from the router's DHCP pool so Docker can never hand a
          # container an address that collides with a DHCP lease.
          ip_range: 192.168.1.96/28

  common-network:
    external: true