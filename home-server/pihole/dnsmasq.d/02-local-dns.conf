# Split-horizon DNS for services hosted on this NAS.
#
# nas.soaalex.com is a DNS-only (grey cloud) Cloudflare record, so it resolves to the
# WAN IP. A LAN or VPN client sending traffic there needs the Livebox to hairpin it back
# inside, which it does not do — so the NAS admin page is unreachable over the VPN while
# the Cloudflare-proxied hosts (bitwarden, teslamate) still work, because their traffic
# genuinely leaves and re-enters via Cloudflare.
#
# Answering with the LAN address instead sends clients straight to Nginx Proxy Manager
# on 192.168.1.55:443, which serves the vhost correctly (verified: HTTP 307 in ~9ms).
#
# The AAAA needs its own line: an `address=` with only an IPv4 does NOT suppress AAAA,
# dnsmasq still forwards those upstream. Here that returns bridge0's global IPv6, but the
# WireGuard tunnel carries no IPv6 at all (wg0 is 10.13.13.1/32, and the server-side peer
# AllowedIPs are IPv4-only) even though peers advertise AllowedIPs = ::/0. A client
# preferring IPv6 therefore routes the packet into the tunnel and it is dropped; it only
# recovers once Happy Eyeballs falls back to IPv4.
#
# Answering :: makes that failure immediate instead of a timeout — the same mechanism
# Pi-hole uses for blocked domains — so clients go straight to IPv4.
#
# Requires misc.etc_dnsmasq_d = true in pihole.toml, otherwise this file is ignored.
address=/nas.soaalex.com/192.168.1.55
address=/nas.soaalex.com/::
