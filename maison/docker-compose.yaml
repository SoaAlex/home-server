services:
  web:
    build: .
    image: maison:latest
    container_name: maison-web
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    ports:
      - "8090:8000"
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    networks: [common-network]
    # DNS explicite : sans lui Docker copie le résolveur de l'hôte au démarrage (MagicDNS Tailscale
    # 100.100.100.100), qui meurt dès que tailscaled s'arrête.
    dns: [192.168.1.1, 8.8.8.8]
    restart: unless-stopped

  collector:
    image: maison:latest
    container_name: maison-collector
    command: python -m app.collector
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    networks: [common-network]
    dns: [192.168.1.1, 8.8.8.8]
    depends_on: [web]
    restart: unless-stopped

networks:
  common-network:
    external: true
