services:
  database:
    image: postgres:17
    container_name: common-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5000:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - common-network

  redis:
    image: redis:latest
    container_name: common-redis
    restart: always
    command: redis-server --appendonly yes --save 3600 1
    volumes:
      - redis-data:/data
    networks:
      - common-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  common-network:
    name: common-network
    driver: bridge

