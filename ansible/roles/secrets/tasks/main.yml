# Writes each stack's .env from the vault (raw content, byte-identical),
# 1000:10 mode 600. Values never appear in the output, even with -vvv or
# --diff: every task that touches content has no_log, and the reports print
# only paths and variable names.
- name: Require an unlocked vault
  ansible.builtin.assert:
    that: vault_env_files is defined and vault_env_files is mapping
    fail_msg: >-
      No secrets loaded. Give the vault password with --ask-vault-pass or
      ANSIBLE_VAULT_PASSWORD_FILE=~/.config/nas-ansible/vault-pass (ansible/run does it).
    quiet: true

- name: Read required variables from each .env.example
  ansible.builtin.slurp:
    src: "{{ nas_repo_dir }}/{{ item | dirname }}/.env.example"
  loop: "{{ secrets_env_files }}"
  register: secrets_examples
  failed_when: false
  check_mode: false

- name: Compare vault content with required variables
  ansible.builtin.set_fact:
    secrets_missing: >-
      {{ secrets_missing | default({}) | combine({
           item.item: (item.content | b64decode | regex_findall(secrets_key_regex)
                       | difference(vault_env_files[item.item] | default('')
                                    | regex_findall(secrets_key_regex)))
         }) }}
  loop: "{{ secrets_examples.results | selectattr('content', 'defined') }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Stop when a required variable is missing (names only)
  ansible.builtin.fail:
    msg: >-
      {% for f, keys in (secrets_missing | default({})).items() if keys or f not in vault_env_files %}
      stack {{ f | dirname }}: {{ 'no content in the vault' if f not in vault_env_files else 'missing ' ~ (keys | join(', ')) }}.
      {% endfor %}
      Add them with ansible/scripts/vault-import-env.py or vault-set.py, then rerun.
  when: >-
    (secrets_missing | default({})).values() | select | list | length > 0
    or secrets_env_files | difference(vault_env_files.keys()) | length > 0

- name: Write .env files
  ansible.builtin.copy:
    content: "{{ vault_env_files[item] }}"
    dest: "{{ nas_repo_dir }}/{{ item }}"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "{{ secrets_mode }}"
  loop: "{{ secrets_env_files }}"
  register: secrets_written
  no_log: true
  diff: false

- name: Report .env files that changed (paths only)
  ansible.builtin.debug:
    msg: >-
      {{ 'would change' if ansible_check_mode else 'changed' }}:
      {{ secrets_written.results | selectattr('changed') | map(attribute='item') | list or 'none' }}
