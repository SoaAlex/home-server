# .env files to write, relative to nas_repo_dir. Default: every file in the vault.
secrets_env_files: "{{ vault_env_files.keys() | sort }}"
secrets_mode: "0600"
# Variable names in a .env text. Kept in a single-quoted YAML string so the
# backslashes reach the regex engine as written (no Jinja string escaping).
secrets_key_regex: '(?m)^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*='
