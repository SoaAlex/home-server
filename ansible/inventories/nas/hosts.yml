# One host: the NAS. From the Mac, Ansible reaches it on the LAN; the
# control container on the NAS (`ansible/run`) sets NAS_ANSIBLE_HOST=127.0.0.1.
all:
  children:
    nas:
      hosts:
        nas-soaalex:
          ansible_host: "{{ lookup('ansible.builtin.env', 'NAS_ANSIBLE_HOST') | default('192.168.1.55', true) }}"
          ansible_user: soaalex
          ansible_python_interpreter: /usr/bin/python3
