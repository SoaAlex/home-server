# Ansible configuration for the NAS rebuild. Run from this directory
# (`cd ansible`) or through `./run`, which sets the working directory.
[defaults]
inventory = inventories/nas/hosts.yml
roles_path = roles
collections_path = /usr/share/ansible/collections:~/.ansible/collections
# Debian's Python on the target, never the Linuxbrew python3 on the user PATH.
interpreter_python = /usr/bin/python3
retry_files_enabled = False
callback_result_format = yaml
nocows = True
# Tasks that handle secrets set no_log themselves; this keeps a failing
# templated value from being echoed in the error message.
display_args_to_stdout = False

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
