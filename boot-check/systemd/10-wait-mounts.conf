# /etc/systemd/system/user@1000.service.d/10-wait-mounts.conf
#
# With linger on, logind starts the user manager right after systemd-user-sessions, about 14 s
# BEFORE UGOS mounts /volume1, /volume2 and /home (UGOS mounts them from its own storage_serv,
# not from fstab, so there is no mount unit to order against). A user manager that starts before
# /home exists never sees ~/.config/systemd/user: hermes-gateway, hermes-dashboard and the
# nas-backup timers would stay down after every reboot until someone logs in and reloads.
#
# Wait for the mounts first (3 min at most, never fail: the "-" prefix and "exit 0" make a missing
# mount cost three minutes, not the login).
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ $$i -lt 180 ]; do mountpoint -q /volume1 && mountpoint -q /home && exit 0; i=$$((i+1)); sleep 1; done; exit 0'
